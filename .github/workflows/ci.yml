name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch upstream API changes

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Offline tests
        run: pytest -q
      - name: Lint
        run: ruff check src/ tests/

  live-smoke:
    # Verifies the empirical API constraints the pipeline is built on.
    # Allowed to fail on PRs from forks (no network guarantees), but a failure on
    # the scheduled run means an upstream API changed and stage 4 needs revisiting.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Live API smoke tests
        run: pytest -m live -q
