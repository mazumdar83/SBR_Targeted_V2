[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfgm"
version = "0.1.0"
description = "Bacterial function-to-gene mapper: function term to genes, KEGG KOs, UniProt sequences and taxonomy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
bfgm = "bfgm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
